name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - name: Self-check
        run: python scripts/selfcheck.py
      - name: Tests
        run: pytest -q
      - name: Numerical verification
        run: python scripts/verify.py --quick
      - name: Docs match the code
        run: python scripts/gen_parameter_table.py --check
